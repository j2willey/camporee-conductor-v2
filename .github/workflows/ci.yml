name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  smoke:
    name: smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @camporee-conductor/composer-web exec playwright install --with-deps chromium
      # Builds the web app, seeds a fresh database and runs it behind the API with the dev sign-in:
      # no Clerk secrets (issue #4, D7).
      - name: Smoke test
        run: pnpm --filter @camporee-conductor/composer-web e2e
      # The judge page, served by the Collator loaded with the Circus 2026 event-day cartridge (#40).
      - name: Judge page test
        run: pnpm --filter @camporee-conductor/collator-web e2e
      - name: Keep the trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            apps/composer-web/test-results/
            apps/collator-web/test-results/
          retention-days: 7

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t composer .
      # Placeholder Clerk keys: enough to start and serve the app; nothing signs in (issue #4, D5).
      - name: Start and answer
        run: |
          docker run -d --name composer -p 3010:3010 \
            -e CLERK_SECRET_KEY=sk_test_placeholder -e CLERK_PUBLISHABLE_KEY=pk_test_placeholder composer
          for i in $(seq 30); do curl -sf localhost:3010/health && break; sleep 1; done
          curl -sf localhost:3010/ | grep -q "<title>Composer</title>"
          docker logs composer
      - name: Refuses the dev sign-in in production
        run: |
          ! docker run --rm -e AUTH_ADAPTER=dev composer

  collator-box:
    name: Collator box rehearsal (Docker, Caddy, HTTPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The rehearsal builds the test cartridge from the fixtures with the workspace's code.
      - name: Install
        run: pnpm install --frozen-lockfile
      # Builds the image, starts Compose with TLS_MODE=internal on :8443, and checks a score end to end
      # over HTTPS by hostname, the Official view and the backups (#40).
      - name: Rehearse
        run: docs/runbook/rehearse-collator.sh
